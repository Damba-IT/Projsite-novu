services:
  minio:
    container_name: '${MINIO_DOCKER_NAME-minio_main}'
    image: 'minio/minio:latest'
    network_mode: bridge
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '${DOCKER_MINIO_PORT:-9001}:9000'
      - '${DOCKER_MINIO_CONSOLE_PORT:-9002}:9001'
    volumes:
      - '${TMPDIR:-/tmp/minio}:/data'

  minio-init:
    container_name: '${MINIO_INIT_DOCKER_NAME-minio_init}'
    image: 'minio/mc:latest'
    network_mode: service:minio
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-novu}
    entrypoint: >-
      /bin/sh -c "until mc alias set minio http://127.0.0.1:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do sleep 1; done;
      mc mb --ignore-existing minio/$$MINIO_BUCKET"

  mongo:
    container_name: '${MONGO_DOCKER_NAME-mongo_main}'
    image: mongo:8.0.17
    network_mode: bridge
    ports:
      - '${DOCKER_MONGO_PORT:-27017}:27017'
    volumes:
      - '${TMPDIR:-/tmp/mongo}:/db/data'
    healthcheck:
      test: 'bash -c ''mongo --host 127.0.0.1:27017 --eval "printjson(rs.status())"'''
      retries: 5
      interval: 10s

  redis:
    container_name: '${REDIS_DOCKER_NAME-redis_main}'
    image: redis
    network_mode: bridge
    ports:
      - '${DOCKER_REDIS_SERVICE_PORT:-6379}:6379'
    healthcheck:
      test: "bash -c 'redis-cli ping'"
      retries: 5
      interval: 10s

  clickhouse:
    container_name: '${CLICKHOUSE_DOCKER_NAME-clickhouse_main}'
    image: clickhouse/clickhouse-server:24.3-alpine
    network_mode: bridge
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - '${DOCKER_CLICKHOUSE_HTTP_PORT:-8123}:8123'
      - '${DOCKER_CLICKHOUSE_NATIVE_PORT:-9000}:9000'
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
